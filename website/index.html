<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Water Supply Billing System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Water Supply Billing System</h1>
        <p>Smart and Simple Water Bill Management</p>
    </header>

    <main>

        <section class="billing-card">

            <h2>Generate Water Bill</h2>

            <form id="billingForm">

                <label for="customerId">
                    Customer ID
                </label>

                <input
                    type="number"
                    id="customerId"
                    placeholder="Enter Customer ID"
                    required
                >

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter Customer Name"
                    required
                >

                <label for="customerType">
                    Customer Type
                </label>

                <select id="customerType" required>
                    <option value="">Select Customer Type</option>
                    <option value="domestic">Domestic</option>
                    <option value="commercial">Commercial</option>
                </select>

                <label for="consumption">
                    Water Consumption (Units)
                </label>

                <input
                    type="number"
                    id="consumption"
                    placeholder="Enter water consumption"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Calculate Bill
                </button>
<button type="button" id="resetButton">
    Reset
</button>
            </form>

        </section>


        <section id="billResult" class="bill-result">

            <h2>Bill Details</h2>

            <p>
                <strong>Customer ID:</strong>
                <span id="resultId">-</span>
            </p>

            <p>
                <strong>Customer Name:</strong>
                <span id="resultName">-</span>
            </p>

            <p>
                <strong>Customer Type:</strong>
                <span id="resultType">-</span>
            </p>

            <p>
                <strong>Water Consumption:</strong>
                <span id="resultConsumption">-</span>
            </p>

            <p class="total">
                <strong>Total Water Bill:</strong>
                ₹<span id="resultBill">0.00</span>
            </p>

        </section>

    </main>


    <footer>
        <p>
            Water Supply Billing System | C++ OOP Project
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
